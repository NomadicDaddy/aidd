name: Release

on:
    workflow_run:
        workflows: [CI]
        types: [completed]

# Only one release workflow per triggering CI run.
concurrency:
    group: release-${{ github.event.workflow_run.id }}
    cancel-in-progress: false

permissions:
    contents: write

jobs:
    github-release:
        name: Create GitHub Release
        # Windows runner is required: the standalone aidd-web binary is compiled with
        # --windows-hide-console, which Bun only permits when compiling on Windows.
        runs-on: windows-latest
        timeout-minutes: 20
        defaults:
            run:
                # Use Git Bash (preinstalled on the Windows runner) so the ${VAR} and *.zip
                # glob syntax in the run steps below behaves the same as on a POSIX shell.
                shell: bash
        # Only create a release when CI succeeds AND the CI run was triggered by a version tag.
        if: >-
            ${{
                github.event.workflow_run.conclusion == 'success' &&
                github.event.workflow_run.event == 'push' &&
                github.event.workflow_run.head_repository.full_name == github.repository &&
                startsWith(github.event.workflow_run.head_branch, 'v')
            }}

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  ref: ${{ github.event.workflow_run.head_sha }}

            - name: Setup Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version-file: package.json

            # Cache only Bun's content-addressed download cache. Never cache node_modules: a job
            # that dies mid-install can save an incomplete tree in the post step.
            - name: Cache Bun dependencies
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.bun/install/cache
                  key: bun-dl-${{ runner.os }}-${{ hashFiles('bun.lock') }}
                  restore-keys: |
                      bun-dl-${{ runner.os }}-

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Package release assets
              run: bun run release:package -- --target bun-windows-x64-modern

            # CI already ran the behavioral gates (bun test, build:frontend,
            # smoke:qc, feature/artifact checks) on this exact SHA before this
            # workflow_run fired. Here we only validate release-artifact
            # integrity: version parity, required files, and standalone layout.
            - name: Release check
              run: bun run release:check -- --target bun-windows-x64-modern --skip-command-gates

            # Opens the exact ZIP that is about to be published and validates its identity, source
            # manifest, catalog parity, license notices, and LGPL relink offer.
            - name: License notices present in the release archives
              run: bun run check:release-notices

            - name: Create GitHub Release with packaged assets
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG_NAME: ${{ github.event.workflow_run.head_branch }}
              run: >
                  gh release create "${TAG_NAME}"
                  dist/release/*.zip
                  dist/release/SHA256SUMS.txt
                  dist/release/release-notes.md
                  dist/release/source-record-*.md
                  --notes-file dist/release/release-notes.md
                  --verify-tag
