# Disable automatic .env file loading - we use JSON config exclusively.
# Note: This does NOT prevent the explicit process.env reads in shared/src/config/env-secrets.ts,
# which take credentials (AIDD_WEB_AUTH_TOKEN, AIDD_TELEGRAM_BOT_TOKEN) from the environment.
# See "Credentials In The Environment" in docs/reference/configuration.md.
env = false

[test]
# Only discover aidd's maintained tests, never tests in runtime audit checkouts or reports.
root = "./test"
# Refuses to start a second concurrent `bun test` for this repo - see the preload.
preload = ["./test/test-run-lock.preload.ts"]
# Coverage reports describe production behavior; counting the assertions themselves inflates it.
coverageSkipTestFiles = true
